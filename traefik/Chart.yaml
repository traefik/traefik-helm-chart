apiVersion: v2
name: traefik
description: A Traefik based Kubernetes ingress controller
type: application
version: 41.2.0
# renovate: image=traefik
appVersion: v3.7.11
kubeVersion: '>=1.25.0-0'
keywords:
  - traefik
  - ingress
  - networking
home: https://traefik.io/
sources:
  - https://github.com/traefik/traefik-helm-chart
  - https://github.com/traefik/traefik
maintainers:
  - name: mloiseleur
    email: michel.loiseleur@traefik.io
  - name: darkweaver87
    email: remi.buisson@traefik.io
  - name: jnoordsij
icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png
annotations:
  traefik.io/proxy-min-version: v3.6.0
  traefik.io/proxy-max-version: v3.7.11
  traefik.io/hub-min-version: v3.19.3
  traefik.io/hub-max-version: v3.20.11
  artifacthub.io/changes: |
    - kind: changed
      description: "test(service): LoadBalancer node port opt-out"
    - kind: fixed
      description: "fix(rbac): allow namespaced rbac with only the knative provider"
    - kind: fixed
      description: "fix(hub): 🐛 enable providers with default config"
    - kind: fixed
      description: "fix(crds/middleware): add missing ErrorRequestHeaders field"
    - kind: added
      description: "feat: allow setting emptyDir options for data and tmp volumes"
    - kind: added
      description: "feat(hub): support AWS EC2 provider"
    - kind: added
      description: "feat(deps): update traefik docker tag to v3.7.10"
    - kind: added
      description: "feat(deps): update ghcr.io/traefik/traefik-hub docker tag to v3.20.8"
    - kind: changed
      description: "ci(renovate): scope updates per chart on VALUES.md & AppVersion"
