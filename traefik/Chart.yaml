apiVersion: v2
name: traefik
description: A Traefik based Kubernetes ingress controller
type: application
version: 42.4.1
# renovate: image=traefik
appVersion: v3.7.19
kubeVersion: '>=1.30.0-0'
keywords:
  - traefik
  - ingress
  - networking
home: https://traefik.io/
sources:
  - https://github.com/traefik/traefik-helm-chart
  - https://github.com/traefik/traefik
maintainers:
  - name: mloiseleur
    email: michel.loiseleur@traefik.io
  - name: darkweaver87
    email: remi.buisson@traefik.io
  - name: jnoordsij
icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png
annotations:
  traefik.io/proxy-min-version: v3.7.0
  traefik.io/proxy-max-version: v3.7.19
  traefik.io/hub-min-version: v3.21.0
  traefik.io/hub-max-version: v3.21.12
  artifacthub.io/changes: |
    - kind: fixed
      description: "fix(poddisruptionbudget): keep minAvailable and maxUnavailable when set to 0"
    - kind: fixed
      description: "fix(daemonset): keep revisionHistoryLimit when set to 0"
    - kind: added
      description: "feat(hub): support traefik hub v3.21.12"
    - kind: added
      description: "feat(deps): update traefik docker tag to v3.7.19"
    - kind: changed
      description: "chore(deps): update github actions"
