{{- if and .Values.hub.token .Values.hub.restrictSecretTypes }}
{{- $name := printf "%s-secret-types" (include "traefik.clusterRoleName" .) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: traefik-service-account
      expression: 'request.userInfo.username == "system:serviceaccount:{{ include "traefik.namespace" . }}:{{ include "traefik.serviceAccountName" . }}"'
  validations:
    - expression: 'object.type in ["Opaque", "kubernetes.io/tls"]'
      message: Traefik Hub is only allowed to write Secrets of type Opaque or kubernetes.io/tls.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: ["Deny"]
{{- end }}
