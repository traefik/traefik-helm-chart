suite: Metrics Service configuration
templates:
  - service-metrics.yaml
tests:
  - it: "should not fail with long name by default"
    release:
      name: thisisaverylongreleasenameinordertotriggerit
    asserts:
      - hasDocuments:
          count: 0
  - it: "should support prometheus: null"
    set:
      metrics:
        prometheus: null
    asserts:
      - hasDocuments:
          count: 0
  - it: should not provide a dedicated metrics service by default
    asserts:
      - hasDocuments:
          count: 0
  - it: should provide a dedicated metrics service when enabled set to true
    set:
      metrics:
        prometheus:
          service:
            enabled: true
            labels:
              custom-label: label-value
            annotations:
              custom-annotation: annotation-value
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: metadata.labels.custom-label
          value: label-value
      - equal:
          path: metadata.annotations.custom-annotation
          value: annotation-value
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: RELEASE-NAME-NAMESPACE
      - contains:
          path: spec.ports
          content:
            port: 9100
            name: metrics
            targetPort: metrics
            protocol: TCP
  - it: should use the correct port when not using the default entryPoint
    set:
      metrics:
        prometheus:
          entryPoint: traefik
          service:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.ports
          content:
            port: 8080
            name: metrics
            targetPort: traefik
            protocol: TCP
  - it: should normalize entryPoint value for use as targetPort
    set:
      metrics:
        prometheus:
          entryPoint: MyMetricsEntryPoint
          service:
            enabled: true
      ports:
        MyMetricsEntryPoint:
          port: 1234
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ports[0].targetPort
          value: mymetricsentryp
  - it: should render when trying to use a disabled port, so that the human friendly error from requirements.yaml will be shown
    set:
      metrics:
        prometheus:
          service:
            enabled: true
      ports:
        metrics:
          enabled: false
    asserts:
      - hasDocuments:
          count: 1
