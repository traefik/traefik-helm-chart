suite: Traefik hardened image
templates:
  - deployment.yaml
tests:
  - it: should not use the hardened image by default
    chart:
      appVersion: v3.3.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/traefik:v3.3.0

  - it: should use the hardened registry and repository when enabled
    set:
      hub:
        token: my-token
        hardened: true
      image:
        tag: v3.21.0-ea.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.traefik.io/traefik-hub/traefik-hub:v3.21.0-ea.1-hardened

  - it: should use the hardened image in proxy mode
    set:
      hub:
        enabled: true
        hardened: true
      image:
        tag: v3.21.0-ea.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.traefik.io/traefik-hub/traefik-hub:v3.21.0-ea.1-hardened

  - it: should append -hardened to a FIPS tag when enabled
    set:
      hub:
        token: my-token
        hardened: true
      image:
        tag: v3.21.0-fips
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.traefik.io/traefik-hub/traefik-hub:v3.21.0-fips-hardened

  - it: should let the registry be overridden
    set:
      hub:
        token: my-token
        hardened: true
      image:
        registry: myregistry.example.com
        tag: v3.21.0-ea.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myregistry.example.com/traefik-hub/traefik-hub:v3.21.0-ea.1-hardened

  - it: should let the repository be overridden
    set:
      hub:
        token: my-token
        hardened: true
      image:
        repository: acme/traefik-hub
        tag: v3.21.0-ea.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.traefik.io/acme/traefik-hub:v3.21.0-ea.1-hardened

  - it: should not append -hardened when pinning by digest
    set:
      hub:
        token: my-token
        hardened: true
      image:
        digest: sha256:1c5b8b4e2c65b1b8b4e2c65b1b8b4e2c65b1b8b4e2c65b1b8b4e2c65b1b8b4e2
      versionOverride: v3.21.0-ea.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.traefik.io/traefik-hub/traefik-hub@sha256:1c5b8b4e2c65b1b8b4e2c65b1b8b4e2c65b1b8b4e2c65b1b8b4e2c65b1b8b4e2
