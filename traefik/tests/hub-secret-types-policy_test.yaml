suite: Traefik Hub Secret types ValidatingAdmissionPolicy
templates:
  - hub-secret-types-policy.yaml
release:
  name: traefik
  namespace: traefik-ns
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render in proxy mode
    set:
      hub:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render with hub.token when disabled
    set:
      hub:
        token: my-token
        restrictSecretTypes: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the policy and its binding by default with hub.token
    set:
      hub:
        token: my-token
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 0
      - isAPIVersion:
          of: admissionregistration.k8s.io/v1
        documentIndex: 0
      - isKind:
          of: ValidatingAdmissionPolicyBinding
        documentIndex: 1
      - isAPIVersion:
          of: admissionregistration.k8s.io/v1
        documentIndex: 1

  - it: should restrict Secret types written by the Traefik service account
    set:
      hub:
        token: my-token
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: traefik-traefik-ns-secret-types
      - notExists:
          path: metadata.namespace
      - equal:
          path: spec.failurePolicy
          value: Fail
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE", "UPDATE"]
              resources: ["secrets"]
      - equal:
          path: spec.matchConditions
          value:
            - name: traefik-service-account
              expression: 'request.userInfo.username == "system:serviceaccount:traefik-ns:traefik"'
      - equal:
          path: spec.validations
          value:
            - expression: 'object.type in ["Opaque", "kubernetes.io/tls"]'
              message: Traefik Hub is only allowed to write Secrets of type Opaque or kubernetes.io/tls.

  - it: should bind the policy with Deny action
    set:
      hub:
        token: my-token
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: traefik-traefik-ns-secret-types
      - notExists:
          path: metadata.namespace
      - equal:
          path: spec.policyName
          value: traefik-traefik-ns-secret-types
      - equal:
          path: spec.validationActions
          value: ["Deny"]

  - it: should use custom service account name and namespace override
    set:
      namespaceOverride: custom-ns
      serviceAccount:
        name: custom-sa
      hub:
        token: my-token
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: traefik-custom-ns-secret-types
      - equal:
          path: spec.matchConditions[0].expression
          value: 'request.userInfo.username == "system:serviceaccount:custom-ns:custom-sa"'
