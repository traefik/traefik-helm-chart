suite: Hub Secret types ValidatingAdmissionPolicy
templates:
  - hub-secret-types-policy.yaml
tests:
  - it: is absent without Hub
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders the policy and its binding when Hub is enabled
    set:
      traefik.hub: {}
    asserts:
      - hasDocuments: { count: 2 }
      - documentIndex: 0
        isKind: { of: ValidatingAdmissionPolicy }
      - documentIndex: 0
        isAPIVersion: { of: admissionregistration.k8s.io/v1 }
      - documentIndex: 1
        isKind: { of: ValidatingAdmissionPolicyBinding }
      - documentIndex: 1
        isAPIVersion: { of: admissionregistration.k8s.io/v1 }

  - it: restricts Secret types written by the chart ServiceAccount
    set:
      traefik.hub: {}
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-traefik-NAMESPACE-secret-types
      - notExists:
          path: metadata.namespace
      - equal:
          path: spec.failurePolicy
          value: Fail
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE", "UPDATE"]
              resources: ["secrets"]
      - equal:
          path: spec.matchConditions
          value:
            - name: traefik-service-account
              expression: 'request.userInfo.username == "system:serviceaccount:NAMESPACE:RELEASE-NAME-traefik"'
      - equal:
          path: spec.validations
          value:
            - expression: 'object.type in ["Opaque", "kubernetes.io/tls"]'
              message: Traefik Hub is only allowed to write Secrets of type Opaque or kubernetes.io/tls.

  - it: binds the policy with the Deny action
    set:
      traefik.hub: {}
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-traefik-NAMESPACE-secret-types
      - notExists:
          path: metadata.namespace
      - equal:
          path: spec.policyName
          value: RELEASE-NAME-traefik-NAMESPACE-secret-types
      - equal:
          path: spec.validationActions
          value: ["Deny"]

  - it: follows namespaceOverride
    set:
      traefik.hub: {}
      namespaceOverride: custom-ns
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-traefik-custom-ns-secret-types
      - equal:
          path: spec.matchConditions[0].expression
          value: 'request.userInfo.username == "system:serviceaccount:custom-ns:RELEASE-NAME-traefik"'

  - it: hubSecretTypesPolicy=null disables it
    set:
      traefik.hub: {}
      hubSecretTypesPolicy: null
    asserts:
      - hasDocuments: { count: 0 }

  - it: metadata and spec hatches apply to the policy
    set:
      traefik.hub: {}
      hubSecretTypesPolicy:
        metadata:
          labels:
            team: platform
        spec:
          failurePolicy: Ignore
    asserts:
      - documentIndex: 0
        equal:
          path: spec.failurePolicy
          value: Ignore
      - documentIndex: 0
        equal:
          path: metadata.labels.team
          value: platform
      - documentIndex: 1
        equal:
          path: metadata.labels.team
          value: platform
