{{- if and (include "traefik.hubEnabled" .) (kindIs "map" .Values.hubSecretTypesPolicy) -}}
{{- $name := printf "%s-secret-types" (include "traefik.clusterScopedName" .) -}}
{{- $username := printf "system:serviceaccount:%s:%s" (include "traefik.namespace" .) (include "traefik.fullname" .) -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  {{- include "traefik.singletonMeta" (dict "ctx" . "key" "hubSecretTypesPolicy" "name" $name) | nindent 2 }}
spec:
  {{- $chartSpec := dict
      "failurePolicy" "Fail"
      "matchConstraints" (dict "resourceRules" (list (dict
          "apiGroups" (list "")
          "apiVersions" (list "v1")
          "operations" (list "CREATE" "UPDATE")
          "resources" (list "secrets")
      )))
      "matchConditions" (list (dict
          "name" "traefik-service-account"
          "expression" (printf "request.userInfo.username == %q" $username)
      ))
      "validations" (list (dict
          "expression" "object.type in [\"Opaque\", \"kubernetes.io/tls\"]"
          "message" "Traefik Hub is only allowed to write Secrets of type Opaque or kubernetes.io/tls."
      ))
  -}}
  {{- $userSpec := (.Values.hubSecretTypesPolicy | default dict).spec | default dict -}}
  {{- include "traefik.strategicMerge" (dict "base" $chartSpec "patch" $userSpec) | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  {{- include "traefik.singletonMeta" (dict "ctx" . "key" "hubSecretTypesPolicy" "name" $name) | nindent 2 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end -}}
